
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survive Your Ideas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#101322;color:white;font-family:Arial;text-align:center;margin:0;padding:18px}
h1{color:#ffcf45}
.card{background:#202942;padding:16px;margin:12px auto;border-radius:14px;max-width:450px}
button,input{padding:12px;margin:5px;border:0;border-radius:9px}
button{background:#6549e8;color:white;font-weight:bold}
input{background:#303b55;color:white}
.stat{display:inline-block;padding:12px}
#chat{height:130px;overflow:auto;text-align:left;background:#101322;padding:8px}
</style>
</head>
<body>
<h1>⚔️ SURVIVE YOUR IDEAS</h1>
<div class="card">
<input id="name" placeholder="Your nickname">
<button onclick="joinPublic()">🌍 Find Match</button>
<br>
<input id="code" placeholder="Private room code">
<button onclick="joinPrivate()">🔐 Join Room</button>
<button onclick="createRoom()">➕ Create Room</button>
</div>
<div class="card">
<h2>🏟️ Multiplayer Room</h2>
<h3 id="room">Not connected</h3>
<p id="players">Players: 0/16</p>
<div id="playerlist"></div>
</div>
<div class="card">
<h2>❤️ Your Stats</h2>
<div class="stat">❤️ <span id="hp">100</span> HP</div>
<div class="stat">🪙 <span id="coins">0</span></div>
<div class="stat">💎 <span id="diamonds">0</span></div>
</div>
<div class="card">
<h2 id="monster">🍌 GIANT BANANA</h2>
<p>Monster HP: <span id="mhp">50</span></p>
<button onclick="fight()">⚔️ FIGHT</button>
<button onclick="heal()">🧪 HEAL</button>
</div>
<div class="card">
<h2>💬 Live Chat</h2>
<div id="chat"></div>
<input id="message" placeholder="Say something...">
<button onclick="sendChat()">Send</button>
</div>
<script>
const SUPABASE_URL="https://eykuwyhvrhknqeyolsbm.supabase.co/rest/v1/";
const SUPABASE_KEY="sb_publishable_lhiGucAXr5iTs2CnqC6nFw_PT3wp36O";
let db=null, channel=null, roomCode="", nickname="Player";
let hp=100, coins=0, diamonds=0, monsterHP=50;
let players={};
if(!SUPABASE_URL.includes("PASTE_")){
 db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
}
function update(){
 document.getElementById("hp").textContent=hp;
 document.getElementById("coins").textContent=coins;
 document.getElementById("diamonds").textContent=diamonds;
 document.getElementById("mhp").textContent=monsterHP;
}
function showPlayers(){
 let names=Object.values(players);
 document.getElementById("players").textContent="Players: "+names.length+"/16";
 document.getElementById("playerlist").textContent=names.join(" • ");
}
async function enterRoom(code){
 if(!db){alert("Add your Supabase URL and publishable key first!");return;}
 nickname=document.getElementById("name").value.trim()||"Player";
 roomCode=code;
 if(channel) await db.removeChannel(channel);
 channel=db.channel("room-"+roomCode,{config:{presence:{key:nickname},broadcast:{self:false}}});
 channel.on("presence",{event:"sync"},()=>{
  players={};
  Object.values(channel.presenceState()).forEach(list=>{
   list.forEach(p=>players[p.nickname]=p.nickname);
  });
  showPlayers();
 });
 channel.on("broadcast",{event:"chat"},({payload})=>addChat(payload.name+": "+payload.text));
 channel.subscribe(async status=>{
  if(status==="SUBSCRIBED"){
   await channel.track({nickname});
   document.getElementById("room").textContent="Room: "+roomCode;
  }
 });
}
function createRoom(){
 enterRoom(Math.random().toString(36).slice(2,8).toUpperCase());
}
function joinPrivate(){
 let c=document.getElementById("code").value.trim().toUpperCase();
 if(c)enterRoom(c);else alert("Enter a room code!");
}
function joinPublic(){enterRoom("PUBLIC-LOBBY");}
async function sendChat(){
 let text=document.getElementById("message").value.trim();
 if(!text||!channel)return;
 await channel.send({type:"broadcast",event:"chat",payload:{name:nickname,text}});
 addChat("You: "+text);
 document.getElementById("message").value="";
}
function addChat(text){
 let box=document.getElementById("chat");
 let line=document.createElement("div");
 line.textContent=text;box.appendChild(line);box.scrollTop=box.scrollHeight;
}
function fight(){
 monsterHP-=10;
 if(monsterHP<=0){
  monsterHP=50;coins+=15;diamonds+=2;
  alert("Monster defeated! +15 coins and +2 diamonds!");
 }
 update();
}
function heal(){hp+=50;update();}
update();
</script>
</body>
</html>
